spring:
  application:
    name: core
  mongodb:
    # Compose la pasa con la base incluida (/wearhack). En AWS sale de SSM o de un .env
    # fuera del repo, nunca de aqui.
    uri: ${MONGO_URI:mongodb://localhost:27017/wearhack}

server:
  port: ${SERVER_PORT:8090}
  shutdown: graceful
  tomcat:
    threads:
      min-spare: 4

wearhack:
  version: '@project.version@'
  # El User Pool que emite los tokens. Sin USER_POOL_ID el Core arranca pero rechaza todo
  # token: solo responden los health checks.
  cognito:
    region: ${COGNITO_REGION:us-east-1}
    user-pool-id: ${COGNITO_USER_POOL_ID:}
    # App clients aceptados, separados por coma. Obligatorio si hay User Pool.
    client-ids: ${COGNITO_CLIENT_IDS:}

  ia:
    colorimetria:
      url: ${COLORIMETRIA_URL:http://colorimetria:8091}
      ruta: ${COLORIMETRIA_RUTA:/v1/colorimetria/analizar}
      timeout-segundos: 10
  usuarios:
    correcciones:
      # Desvincula las correcciones de colorimetria consumidas o con mas de 30 dias.
      # Una vez al dia, de madrugada en Colombia. "-" la desactiva.
      cron: ${CORRECCIONES_DESVINCULACION_CRON:0 30 8 * * *}
      dias-maximos: 30
    colorimetria:
      max-recorte-bytes: 5242880
  closet:
    imagenes:
      bucket: ${S3_BUCKET_PRENDAS:wearhack-prendas}
      region: ${S3_REGION:us-east-1}
      # Vacio en AWS: usa el de la region y las credenciales del rol de la tarea.
      endpoint: ${S3_ENDPOINT:}
      # El que firma las URLs que abre el telefono. En local MinIO es minio:9000 para el
      # Core, pero el telefono tiene que llegar por otro nombre.
      endpoint-publico: ${S3_ENDPOINT_PUBLICO:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      max-bytes: 5242880
      url-minutos: 15

management:
  endpoints:
    web:
      exposure:
        # Solo lo que necesitamos. Exponer '*' regala superficie de ataque.
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  # El agente de OpenTelemetry se encarga de las trazas. Micrometer solo necesita
  # saber a que servicio pertenecen las metricas.
  metrics:
    tags:
      service: core

logging:
  level:
    root: ${LOG_LEVEL:INFO}
