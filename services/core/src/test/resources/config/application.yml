# Se suma al application.yml principal y gana sobre el en las pruebas (Spring lee
# config/ despues de la raiz del classpath).

wearhack:
  # Sin pool: el decodificador real rechaza todo. Las pruebas que necesitan un usuario
  # autenticado usan jwt() de spring-security-test, que no pasa por el decodificador.
  cognito:
    user-pool-id: ""
    client-ids: ""
  usuarios:
    correcciones:
      # Las pruebas llaman a la tarea a mano, con su propio reloj.
      cron: "-"
    colorimetria:
      max-recorte-bytes: 5242880
  closet:
    imagenes:
      # Las pruebas reemplazan AlmacenImagenes por un mock: esto solo deja construir el cliente.
      bucket: wearhack-prendas-test
      endpoint: http://localhost:9
      access-key: prueba
      secret-key: prueba
      max-bytes: 1024
  ia:
    colorimetria:
      url: ${COLORIMETRIA_URL:http://colorimetria:8091}
      ruta: ${COLORIMETRIA_RUTA:/v1/colorimetria/analizar}
      timeout-segundos: 10   # techo acordado en protocolos, seccion 4

management:
  health:
    # Sin esto /actuator/health saldria DOWN en las pruebas que no levantan Mongo.
    mongodb:
      enabled: false
