# Analiza y construye el cliente Flutter.
#
# Solo corre cuando cambia client/. Mientras esa carpeta no exista, este
# workflow no se dispara nunca.

name: Flutter

on:
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/flutter.yml'
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/flutter.yml'

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: client

jobs:

  verificar:
    name: Analizar y construir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 17 porque es lo que fija el proyecto de Android generado
      # (sourceCompatibility y jvmTarget). Compilar con otra deja avisos y, con
      # suerte, un fallo claro; sin suerte, un APK que se comporta distinto.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Clavada a la version con la que se desarrolla. Que CI use otra convierte
      # cada diferencia de toolchain en un fallo que no se reproduce en local.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Descargar dependencias
        run: flutter pub get

      - name: Comprobar el formato
        run: dart format --output=none --set-exit-if-changed .

      - name: Analizar
        run: flutter analyze

      - name: Probar
        run: flutter test

      # Las dos builds que pide el criterio de terminado. La de web es la que
      # detecta que algo de captura o de los interpretes se colo fuera de su
      # carpeta: en web no existe camara ni LiteRT, asi que un import mal
      # aislado rompe aqui y en ningun otro sitio.
      # minSdk 26 y sin copia de seguridad automatica (#48): el closet y el token
      # no deben acabar en un backup de Google. Son archivos generados por
      # flutter create, asi que una regeneracion podria devolver los valores por
      # defecto sin que nadie lo note. Este paso lo nota.
      - name: Comprobar minSdk y allowBackup
        run: |
          grep -qE '^\s*minSdk\s*=\s*26\s*$' android/app/build.gradle.kts \
            || { echo "android/app/build.gradle.kts debe fijar minSdk = 26"; exit 1; }
          grep -q 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml \
            || { echo 'AndroidManifest.xml debe tener android:allowBackup="false"'; exit 1; }

      # Web antes que el APK: dart2js necesita bastante memoria, y despues del APK
      # los daemons de Gradle y Kotlin siguen vivos con su heap (-Xmx8G en
      # android/gradle.properties). En el runner de un repo privado eso agoto la
      # memoria y el job se cancelo a mitad de dart2js (PR #96).
      - name: Construir web
        run: flutter build web

      # APK de prueba, uno por ABI: arm64-v8a para los telefonos actuales y
      # armeabi-v7a para los de 32 bits. Release porque es lo que se instala en
      # las pruebas; mientras no haya keystore, el proyecto lo firma con las
      # claves de debug. iOS queda fuera del MVP (sin runner macOS).
      - name: Construir APK
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: wearhack-apk-${{ github.sha }}
          path: |
            client/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            client/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error
          # Los artefactos cuentan contra el almacenamiento del repo privado.
          retention-days: 7
