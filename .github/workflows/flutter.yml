# Analiza y construye el cliente Flutter.
#
# Solo corre cuando cambia client/. Mientras esa carpeta no exista, este
# workflow no se dispara nunca.

name: Flutter

on:
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/flutter.yml'
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/flutter.yml'

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: client

jobs:

  verificar:
    name: Analizar y construir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.x'
          channel: stable
          cache: true

      - name: Descargar dependencias
        run: flutter pub get

      - name: Comprobar el formato
        run: dart format --output=none --set-exit-if-changed .

      - name: Analizar
        run: flutter analyze

      - name: Probar
        run: flutter test

      # Las dos builds que pide el criterio de terminado. La de web es la que
      # detecta que algo de captura o de los interpretes se colo fuera de su
      # carpeta: en web no existe camara ni LiteRT, asi que un import mal
      # aislado rompe aqui y en ningun otro sitio.
      - name: Construir APK
        run: flutter build apk --debug

      - name: Construir web
        run: flutter build web
