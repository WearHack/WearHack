# Publica en GHCR las imagenes del monolito para la EC2 del Learner Lab (#47).
#
# Cada commit de develop deja ghcr.io/wearhack/wearhack-<servicio>:<sha> y :develop.
# La EC2 (infra/lab/aws/desplegar.sh) espera a que existan las del commit y hace
# 'docker compose pull' en vez de construir en el host.
#
# Se publica en cada push, sin filtro de rutas: la EC2 busca la imagen del sha exacto,
# y un commit que solo toca docs tambien tiene que tenerla. Sin credenciales de AWS:
# el lab no deja crear el rol OIDC, por eso la EC2 tira de GHCR y no al reves.

name: Imagenes del lab

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: imagenes-lab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar ${{ matrix.servicio }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio: [core, colorimetria, recomendador]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Entrar a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # El label source liga el paquete al repo: asi el GITHUB_TOKEN puede volver a
      # escribirlo y el paquete hereda la visibilidad del repo.
      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: ./services/${{ matrix.servicio }}
          push: true
          tags: |
            ghcr.io/wearhack/wearhack-${{ matrix.servicio }}:${{ github.sha }}
            ghcr.io/wearhack/wearhack-${{ matrix.servicio }}:develop
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=lab-${{ matrix.servicio }}
          cache-to: type=gha,mode=max,scope=lab-${{ matrix.servicio }}
