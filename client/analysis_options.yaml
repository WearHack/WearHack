include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # El codigo de captura vive detras de imports condicionales. Un import sin
    # usar ahi suele significar que algo de movil se colo en la rama de web,
    # que es justo lo que no puede pasar.
    unused_import: error
    unused_local_variable: error
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**

linter:
  rules:
    - prefer_const_constructors
    - prefer_final_locals
    - avoid_print
