name: wearhack
description: Cliente de WearHack. Android, iOS y Web desde un solo proyecto.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  # Registro e inicio de sesion contra Cognito (issue #10). Versiones fijas: los
  # paquetes de Amplify se publican juntos y tienen que coincidir entre si.
  amplify_auth_cognito: 2.15.1
  amplify_flutter: 2.15.0
  archive: ^4.3.0
  camera: ^0.12.1
  camera_platform_interface: ^2.14.0
  crypto: ^3.0.7
  device_info_plus: ^13.3.0
  flutter:
    sdk: flutter
  google_mlkit_face_detection: ^0.15.1
  http: ^1.6.0
  image: ^4.10.1
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  # Estado termico del sistema (Android 10+) y temperatura de la bateria, para
  # pausar la cola de captura de prendas si el telefono se calienta (#11).
  thermal: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Los modelos on-device no van en git: pesan demasiado. La carpeta existe con
  # un README que explica de donde bajarlos. Ver assets/models/README.md.
  assets:
    - assets/models/
