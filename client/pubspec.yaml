name: wearhack
description: Cliente de WearHack. Android, iOS y Web desde un solo proyecto.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  # Registro e inicio de sesion contra Cognito (issue #10). Versiones fijas: los
  # paquetes de Amplify se publican juntos y tienen que coincidir entre si.
  amplify_auth_cognito: 2.15.1
  amplify_flutter: 2.15.0
  archive: ^4.3.0
  camera: ^0.12.1
  camera_platform_interface: ^2.14.0
  crypto: ^3.0.7
  device_info_plus: ^13.3.0
  flutter:
    sdk: flutter
  google_mlkit_face_detection: ^0.15.1
  http: ^1.6.0
  image: ^4.10.1
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  # Estado termico del sistema (Android 10+) y temperatura de la bateria, para
  # pausar la cola de captura de prendas si el telefono se calienta (#11).
  tflite_flutter: 0.12.1
  thermal: ^1.2.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Genera los iconos de Android e iOS desde assets/icono/ (ver flutter_launcher_icons
  # abajo): dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # Los modelos on-device no van en git: pesan demasiado. La carpeta existe con
  # un README que explica de donde bajarlos. Ver assets/models/README.md.
  assets:
    - assets/models/
    # Tabla ISCC-NBS de categorias de color (#58). La genera tools/iscc-nbs/.
    - assets/color/

# Icono de la app (el gancho con la W). Los iconos de android/ e ios/ salen de aqui:
# no se editan a mano, se regeneran con `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  image_path: assets/icono/icono_wearhack.png
  android: true
  min_sdk_android: 26
  # Icono adaptable (Android 8+): fondo crema y el logo dentro de la zona segura.
  adaptive_icon_background: "#F9F5EA"
  adaptive_icon_foreground: assets/icono/icono_frente.png
  ios: true
  remove_alpha_ios: true
