# Solo configuracion de herramientas: el analisis corre con el entorno del
# servicio de Colorimetria (ver README.md), del que reutiliza el codigo.

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"
